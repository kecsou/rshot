[package]
name = "rshot"
version = "0.1.0"
description = "Screenshots whose path lands on your clipboard"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clipboard-rs = "0.3"
xcap = "0.9"
tauri-plugin-notification = "2.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-drag = "2.1"
tauri-plugin-autostart = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
libc = "0.2"
x11rb = { version = "0.14", features = ["xfixes"] }
zbus = "5"

# Optimise dependencies (xcap, image/png) in dev builds; a debug capture takes seconds otherwise.
[profile.dev.package."*"]
opt-level = 2
